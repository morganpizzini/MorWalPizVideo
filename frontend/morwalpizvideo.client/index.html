<!doctype html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101010" />
    <meta property="og:site_name" content="MorWalPiz" />

    <!-- Load runtime environment configuration (injected by Docker entrypoint) -->
    <script src="/env-config.js"></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* Minimal skeleton styles — visible before the React bundle loads/hydrates */
        #initial-skeleton {
            font-family: 'Manrope', sans-serif;
            max-width: 1480px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        #initial-skeleton .sk-title {
            text-align: center;
            font-weight: 700;
            font-size: 2.5rem;
            letter-spacing: 0;
            margin: 0 0 1.5rem;
            color: #fff;
        }

        #initial-skeleton .sk-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(1, 1fr);
        }

        @media (min-width: 600px) {
            #initial-skeleton .sk-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 900px) {
            #initial-skeleton .sk-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        #initial-skeleton .sk-card {
            background: #181818;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        #initial-skeleton .sk-thumb {
            aspect-ratio: 16 / 9;
            background: linear-gradient(110deg, #222 30%, #303030 50%, #222 70%);
            background-size: 200% 100%;
            animation: sk-shimmer 1.4s linear infinite;
        }

        #initial-skeleton .sk-body {
            padding: 0.85rem 1rem 1.1rem;
        }

        #initial-skeleton .sk-line {
            height: 0.7rem;
            border-radius: 4px;
            background: linear-gradient(110deg, #222 30%, #303030 50%, #222 70%);
            background-size: 200% 100%;
            animation: sk-shimmer 1.4s linear infinite;
            margin-bottom: 0.6rem;
        }

        #initial-skeleton .sk-line.short {
            width: 40%;
        }

        #initial-skeleton .sk-line.tall {
            height: 1rem;
            width: 80%;
        }

        @keyframes sk-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            #initial-skeleton .sk-thumb, #initial-skeleton .sk-line { animation: none; }
        }

        /* Hide skeleton once React renders content into #root */
        #root:not(:empty) + #initial-skeleton {
            display: none;
        }
    </style>
    <!--ssr-head-->
</head>

<body>
    <div id="root"></div>
    <div id="initial-skeleton" aria-hidden="true">
        <h1 class="sk-title">MorWalPiz</h1>
        <div class="sk-grid">
            <div class="sk-card"><div class="sk-thumb"></div><div class="sk-body"><div class="sk-line short"></div><div class="sk-line tall"></div><div class="sk-line"></div><div class="sk-line"></div></div></div>
            <div class="sk-card"><div class="sk-thumb"></div><div class="sk-body"><div class="sk-line short"></div><div class="sk-line tall"></div><div class="sk-line"></div><div class="sk-line"></div></div></div>
            <div class="sk-card"><div class="sk-thumb"></div><div class="sk-body"><div class="sk-line short"></div><div class="sk-line tall"></div><div class="sk-line"></div><div class="sk-line"></div></div></div>
            <div class="sk-card"><div class="sk-thumb"></div><div class="sk-body"><div class="sk-line short"></div><div class="sk-line tall"></div><div class="sk-line"></div><div class="sk-line"></div></div></div>
            <div class="sk-card"><div class="sk-thumb"></div><div class="sk-body"><div class="sk-line short"></div><div class="sk-line tall"></div><div class="sk-line"></div><div class="sk-line"></div></div></div>
            <div class="sk-card"><div class="sk-thumb"></div><div class="sk-body"><div class="sk-line short"></div><div class="sk-line tall"></div><div class="sk-line"></div><div class="sk-line"></div></div></div>
        </div>
        <noscript>
            <p style="text-align:center;margin-top:1rem">Per visualizzare il sito è necessario abilitare JavaScript.</p>
        </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
