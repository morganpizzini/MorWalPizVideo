name: Build Container Image
description: Build a container image with the repository's shared Buildx configuration.

inputs:
  context:
    description: Docker build context
    required: true
  file:
    description: Dockerfile path
    required: true
  push:
    description: Whether to push the built image
    required: false
    default: "false"
  noCache:
    description: Disable all build cache
    required: false
    default: "false"
  tags:
    description: Image tags to apply
    required: false
    default: ""
  buildArgs:
    description: Docker build arguments
    required: false
    default: ""
  cacheFrom:
    description: BuildKit cache sources
    required: false
    default: ""
  cacheTo:
    description: BuildKit cache destinations
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build container image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: ${{ inputs.push }}
        no-cache: ${{ inputs.noCache }}
        tags: ${{ inputs.tags }}
        build-args: ${{ inputs.buildArgs }}
        cache-from: ${{ inputs.cacheFrom }}
        cache-to: ${{ inputs.cacheTo }}
