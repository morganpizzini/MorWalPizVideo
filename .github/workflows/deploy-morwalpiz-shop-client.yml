name: Deploy MorWalPiz Shop Client

on:
  push:
    branches:
      - main
    paths:
      - "frontend/morwalpiz-shop.client/**"
      - "frontend/fe-packages/**"
      - ".github/actions/build-container-image/**"
      - ".github/workflows/deploy-morwalpiz-shop-client.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: morwalpiz-shop-client
  IMAGE_NAME: morwalpiz-shop-client
  NODE_VERSION: '22.x'

jobs:
  validate:
    name: Validate Shop Client Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: ./frontend
        run: yarn install --frozen-lockfile

      - name: Build application
        working-directory: ./frontend
        run: yarn build:shared && yarn workspace morwalpiz-shop.client build

  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: production
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build and push Docker image
        uses: ./.github/actions/build-container-image
        with:
          context: ./frontend
          file: ./frontend/morwalpiz-shop.client/Dockerfile
          push: true
          tags: |
            ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cacheFrom: type=registry,ref=${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache
          cacheTo: type=registry,ref=${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Deploy to Azure Web App
        if: false
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
