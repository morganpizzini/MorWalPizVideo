name: CI - Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  checks: write
  contents: read

jobs:
  secret-artifact-guard:
    name: Secret and Credential Artifact Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for source guard
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run source-safe secret and artifact guard
        run: node scripts/secret-artifact-guard.mjs --tracked

      - name: Test source-safe secret and artifact guard
        run: node --test scripts/secret-artifact-guard.test.mjs

      - name: Verify credential artifacts stay out of build output
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run credential artifact tests
        run: dotnet test MorWalPizVideo.BackOffice.Tests/MorWalPizVideo.BackOffice.Tests.csproj --filter FullyQualifiedName~CredentialArtifactExclusionTests --configuration Release --verbosity minimal --logger "trx;LogFileName=CredentialArtifact.trx" --results-directory ./TestResults

      - name: Publish credential artifact test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ./TestResults/**/*.trx
          check_name: Credential artifact test results
          comment_mode: off

  test-frontend:
    name: Test Frontend - ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [back-office-spa, ask.client, morwalpizvideo.client, shooting-ita-frontend, shooting-range.client, shoot-recorder, freezer-analysis.spa, '@morwalpizvideo/services']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build shared packages
        working-directory: frontend
        run: yarn build:shared

      - name: Run collected tests
        working-directory: frontend
        run: yarn workspace ${{ matrix.workspace }} test --passWithNoTests=false

  test-windows-clients:
    name: Test Windows Client - ${{ matrix.project }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project: [MorWalPiz.InsightScanner.Tests, MorWalPiz.VideoImporter.Tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tests
        run: dotnet restore ${{ matrix.project }}/${{ matrix.project }}.csproj -p:Platform=AnyCPU

      - name: Test
        run: dotnet test ${{ matrix.project }}/${{ matrix.project }}.csproj --configuration Release --no-restore -p:Platform=AnyCPU --logger trx --results-directory TestResults

      - name: Require nonempty test results
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem TestResults -Filter *.trx -Recurse)
          if ($reports.Count -eq 0) { throw 'No desktop test reports collected.' }
          foreach ($report in $reports) {
            [xml]$result = Get-Content $report.FullName
            if ([int]$result.TestRun.ResultSummary.Counters.executed -le 0) {
              throw "No desktop tests executed in $($report.Name)."
            }
          }

      - name: Upload Windows client test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-test-results
          path: ./TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 7

  build-container-images:
    name: Container Image - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: BackOffice API
            context: .
            file: ./MorWalPizVideo.BackOffice/Dockerfile
            noCache: true
          - name: ServerAPI
            context: .
            file: ./MorWalPizVideo.ServerAPI/Dockerfile
            noCache: true
          - name: FreezerAnalysis API
            context: .
            file: ./FreezerAnalysis.Api/Dockerfile
            noCache: true
          - name: ShortLinks API
            context: .
            file: ./MorWalPizVideo.ShortLinks/Dockerfile
            noCache: true
          - name: Shooting Range API
            context: .
            file: ./MorWalPizVideo.ShootingRange/Dockerfile
            noCache: true
          - name: BackOffice SPA
            context: ./frontend
            file: ./frontend/back-office-spa/Dockerfile
            noCache: true
          - name: Ask SPA
            context: ./frontend
            file: ./frontend/ask.client/Dockerfile
            noCache: true
          - name: Public Video SPA
            context: ./frontend
            file: ./frontend/morwalpizvideo.client/Dockerfile
            noCache: true
          - name: Shooting Range SPA
            context: ./frontend
            file: ./frontend/shooting-range.client/Dockerfile
            noCache: true
          - name: FreezerAnalysis SPA
            context: ./frontend
            file: ./frontend/FreezerAnalysis.spa/Dockerfile
            noCache: true
            buildArgs: |
              VITE_FREEZER_API_BASE_URL=${{ vars.FREEZER_ANALYSIS_API_BASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image without pushing
        uses: ./.github/actions/build-container-image
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: "false"
          noCache: ${{ matrix.noCache }}
          buildArgs: ${{ matrix.buildArgs }}

  build-frontend:
    name: Build Frontend Applications
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        app: [back-office-spa, ask.client, morwalpizvideo.client, shooting-ita-frontend, shooting-range.client, shoot-recorder, freezer-analysis.spa]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build shared packages
        working-directory: frontend
        run: yarn build:shared

      - name: Build ${{ matrix.app }}
        working-directory: frontend
        run: if [ "${{ matrix.app }}" = "back-office-spa" ] || [ "${{ matrix.app }}" = "shoot-recorder" ] || [ "${{ matrix.app }}" = "freezer-analysis.spa" ]; then yarn workspace ${{ matrix.app }} build; else yarn workspace ${{ matrix.app }} build:all; fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-dist
          path: frontend/${{ matrix.app }}/dist
          retention-days: 1

  build-backend:
    name: Build Backend Applications
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        project:
          - name: BackOffice
            path: MorWalPizVideo.BackOffice
          - name: ServerAPI
            path: MorWalPizVideo.ServerAPI
          - name: ShortLinks
            path: MorWalPizVideo.ShortLinks
          - name: ShootingRange
            path: MorWalPizVideo.ShootingRange
          - name: FreezerAnalysis
            path: FreezerAnalysis.Api
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project.path }}/${{ matrix.project.path }}.csproj

      - name: Build
        run: dotnet build ${{ matrix.project.path }}/${{ matrix.project.path }}.csproj --configuration Release --no-restore

  build-apphost:
    name: Build Aspire AppHost
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore AppHost
        run: dotnet restore MorWalPizVideo.AppHost/MorWalPizVideo.AppHost.csproj

      - name: Build AppHost
        run: dotnet build MorWalPizVideo.AppHost/MorWalPizVideo.AppHost.csproj --configuration Release --no-restore

  build-windows-clients:
    name: Build Windows Client - ${{ matrix.project.name }}
    runs-on: windows-latest

    strategy:
      matrix:
        project:
          - name: InsightScanner
            path: MorWalPiz.InsightScanner/MorWalPiz.InsightScanner.csproj
          - name: VideoImporter
            path: MorWalPiz.VideoImporter/MorWalPiz.VideoImporter.csproj

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project.path }} -p:Platform=AnyCPU

      - name: Build
        run: dotnet build ${{ matrix.project.path }} --configuration Release --no-restore -p:Platform=AnyCPU

  test-backend:
    name: Test Backend Applications
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend test projects
        run: |
          dotnet restore MorWalPizVideo.BackOffice.Tests/MorWalPizVideo.BackOffice.Tests.csproj
          dotnet restore MorWalPizVideo.ShortLinks.Tests/MorWalPizVideo.ShortLinks.Tests.csproj
          dotnet restore MorWalPizVideo.ShootingRange.Tests/MorWalPizVideo.ShootingRange.Tests.csproj

      - name: Build backend test projects serially
        run: |
          dotnet build MorWalPizVideo.BackOffice.Tests/MorWalPizVideo.BackOffice.Tests.csproj --configuration Release --no-restore -m:1 -p:BuildInParallel=false
          dotnet build MorWalPizVideo.ShortLinks.Tests/MorWalPizVideo.ShortLinks.Tests.csproj --configuration Release --no-restore -m:1 -p:BuildInParallel=false
          dotnet build MorWalPizVideo.ShootingRange.Tests/MorWalPizVideo.ShootingRange.Tests.csproj --configuration Release --no-restore -m:1 -p:BuildInParallel=false

      - name: Test BackOffice regression
        run: |
          dotnet test MorWalPizVideo.BackOffice.Tests/MorWalPizVideo.BackOffice.Tests.csproj --configuration Release --no-restore --no-build --list-tests > backoffice-tests.txt
          grep -Eq '^    .+' backoffice-tests.txt
          dotnet test MorWalPizVideo.BackOffice.Tests/MorWalPizVideo.BackOffice.Tests.csproj --configuration Release --no-restore --no-build --verbosity minimal --logger "trx;LogFileName=BackOffice.trx" --results-directory ./TestResults

      - name: Test ShortLinks host
        run: |
          dotnet test MorWalPizVideo.ShortLinks.Tests/MorWalPizVideo.ShortLinks.Tests.csproj --configuration Release --no-restore --no-build --list-tests > shortlinks-tests.txt
          grep -Eq '^    .+' shortlinks-tests.txt
          dotnet test MorWalPizVideo.ShortLinks.Tests/MorWalPizVideo.ShortLinks.Tests.csproj --configuration Release --no-restore --no-build --verbosity minimal --logger "trx;LogFileName=ShortLinks.trx" --results-directory ./TestResults

      - name: Test ShootingRange host
        run: |
          dotnet test MorWalPizVideo.ShootingRange.Tests/MorWalPizVideo.ShootingRange.Tests.csproj --configuration Release --no-restore --no-build --list-tests > shooting-range-tests.txt
          grep -Eq '^    .+' shooting-range-tests.txt
          dotnet test MorWalPizVideo.ShootingRange.Tests/MorWalPizVideo.ShootingRange.Tests.csproj --configuration Release --no-restore --no-build --verbosity minimal --logger "trx;LogFileName=ShootingRange.trx" --results-directory ./TestResults

      - name: Publish backend test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ./TestResults/**/*.trx
          check_name: Backend test results
          comment_mode: off

  test-freezer-analysis:
    name: Test FreezerAnalysis API
    runs-on: ubuntu-24.04
    needs: build-backend
    env:
      FREEZER_ANALYSIS_PDFTEXTEXTRACTOR_PATH: pdftotext

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Poppler text extractor
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Restore test project
        run: dotnet restore FreezerAnalysis.Api.Tests/FreezerAnalysis.Api.Tests.csproj

      - name: Build renderer tests
        run: dotnet build FreezerAnalysis.Api.Tests/FreezerAnalysis.Api.Tests.csproj --configuration Release --no-restore

      - name: Install pinned Playwright Chromium
        run: pwsh FreezerAnalysis.Api.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test FreezerAnalysis API
        run: |
          dotnet test FreezerAnalysis.Api.Tests/FreezerAnalysis.Api.Tests.csproj --configuration Release --no-restore --list-tests > freezer-analysis-tests.txt
          grep -Eq '^    .+' freezer-analysis-tests.txt
          dotnet test FreezerAnalysis.Api.Tests/FreezerAnalysis.Api.Tests.csproj --configuration Release --no-restore --no-build --verbosity minimal --logger "trx;LogFileName=FreezerAnalysis.trx" --results-directory ./TestResults

      - name: Publish FreezerAnalysis test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ./TestResults/**/*.trx
          check_name: FreezerAnalysis test results
          comment_mode: off

  test-youtube-utilities:
    name: Test YouTube Utilities
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MorWalPizVideo.YouTubeUtilities.Tests/MorWalPizVideo.YouTubeUtilities.Tests.csproj

      - name: Test
        run: dotnet test MorWalPizVideo.YouTubeUtilities.Tests/MorWalPizVideo.YouTubeUtilities.Tests.csproj --configuration Release --no-restore --verbosity minimal --logger "trx;LogFileName=YouTubeUtilities.trx" --results-directory ./TestResults

      - name: Publish YouTube Utilities test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ./TestResults/**/*.trx
          check_name: YouTube Utilities test results
          comment_mode: off