name: CI - Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-frontend:
    name: Build Frontend Applications
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        app: [back-office-spa, ask.client, morwalpizvideo.client, shooting-ita-frontend, shooting-range.client, shoot-recorder]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build shared packages
        working-directory: frontend
        run: yarn build:shared

      - name: Build ${{ matrix.app }}
        working-directory: frontend
        run: if [ "${{ matrix.app }}" = "ask.client" ] || [ "${{ matrix.app }}" = "shooting-range.client" ]; then yarn workspace ${{ matrix.app }} build:all; else yarn workspace ${{ matrix.app }} build; fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-dist
          path: frontend/${{ matrix.app }}/dist
          retention-days: 1

  build-backend:
    name: Build Backend Applications
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        project:
          - name: BackOffice
            path: MorWalPizVideo.BackOffice
          - name: ServerAPI
            path: MorWalPizVideo.ServerAPI
          - name: ShortLinks
            path: MorWalPizVideo.ShortLinks
          - name: ShootingRange
            path: MorWalPizVideo.ShootingRange
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project.path }}/${{ matrix.project.path }}.csproj

      - name: Build
        run: dotnet build ${{ matrix.project.path }}/${{ matrix.project.path }}.csproj --configuration Release --no-restore

  build-apphost:
    name: Build Aspire AppHost
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore AppHost
        run: dotnet restore MorWalPizVideo.AppHost/MorWalPizVideo.AppHost.csproj

      - name: Build AppHost
        run: dotnet build MorWalPizVideo.AppHost/MorWalPizVideo.AppHost.csproj --configuration Release --no-restore

  build-windows-clients:
    name: Build Windows Client - ${{ matrix.project.name }}
    runs-on: windows-latest

    strategy:
      matrix:
        project:
          - name: InsightScanner
            path: MorWalPiz.InsightScanner/MorWalPiz.InsightScanner.csproj
          - name: VideoImporter
            path: MorWalPiz.VideoImporter/MorWalPiz.VideoImporter.csproj

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project.path }} -p:Platform=AnyCPU

      - name: Build
        run: dotnet build ${{ matrix.project.path }} --configuration Release --no-restore -p:Platform=AnyCPU

  test-backend:
    name: Test Backend Applications
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MorWalPizVideo.BackOffice.Tests/MorWalPizVideo.BackOffice.Tests.csproj

      - name: Test
        run: dotnet test MorWalPizVideo.BackOffice.Tests/MorWalPizVideo.BackOffice.Tests.csproj --configuration Release --verbosity normal

  test-youtube-utilities:
    name: Test YouTube Utilities
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MorWalPizVideo.YouTubeUtilities.Tests/MorWalPizVideo.YouTubeUtilities.Tests.csproj

      - name: Test
        run: dotnet test MorWalPizVideo.YouTubeUtilities.Tests/MorWalPizVideo.YouTubeUtilities.Tests.csproj --configuration Release --no-restore --verbosity normal