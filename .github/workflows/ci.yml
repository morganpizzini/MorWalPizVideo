name: CI - Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  secret-artifact-guard:
    name: Secret and Credential Artifact Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js for source guard
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run source-safe secret and artifact guard
        run: node scripts/secret-artifact-guard.mjs --tracked

      - name: Test source-safe secret and artifact guard
        run: node --test scripts/secret-artifact-guard.test.mjs

      - name: Verify credential artifacts stay out of build output
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run credential artifact tests
        run: dotnet test MorWalPizVideo.BackOffice.Tests/MorWalPizVideo.BackOffice.Tests.csproj --filter FullyQualifiedName~CredentialArtifactExclusionTests --configuration Release

  test-frontend:
    name: Test Frontend - ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [back-office-spa, ask.client, morwalpizvideo.client, shooting-ita-frontend, shooting-range.client, shoot-recorder, '@morwalpizvideo/services']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build shared packages
        working-directory: frontend
        run: yarn build:shared

      - name: Run collected tests
        working-directory: frontend
        run: yarn workspace ${{ matrix.workspace }} test --passWithNoTests=false

  test-windows-clients:
    name: Test Windows Client - ${{ matrix.project }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project: [MorWalPiz.InsightScanner.Tests, MorWalPiz.VideoImporter.Tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tests
        run: dotnet restore ${{ matrix.project }}/${{ matrix.project }}.csproj -p:Platform=AnyCPU

      - name: Test
        run: dotnet test ${{ matrix.project }}/${{ matrix.project }}.csproj --configuration Release --no-restore -p:Platform=AnyCPU --logger trx --results-directory TestResults

      - name: Require nonempty test results
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem TestResults -Filter *.trx -Recurse)
          if ($reports.Count -eq 0) { throw 'No desktop test reports collected.' }
          foreach ($report in $reports) {
            [xml]$result = Get-Content $report.FullName
            if ([int]$result.TestRun.ResultSummary.Counters.executed -le 0) {
              throw "No desktop tests executed in $($report.Name)."
            }
          }

  build-api-containers:
    name: Clean API Container - ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [MorWalPizVideo.BackOffice, MorWalPizVideo.ServerAPI]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build from repository context
        run: docker build --no-cache --file ${{ matrix.project }}/Dockerfile .

  build-frontend:
    name: Build Frontend Applications
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        app: [back-office-spa, ask.client, morwalpizvideo.client, shooting-ita-frontend, shooting-range.client, shoot-recorder]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build shared packages
        working-directory: frontend
        run: yarn build:shared

      - name: Build ${{ matrix.app }}
        working-directory: frontend
        run: if [ "${{ matrix.app }}" = "back-office-spa" ] || [ "${{ matrix.app }}" = "shoot-recorder" ]; then yarn workspace ${{ matrix.app }} build; else yarn workspace ${{ matrix.app }} build:all; fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-dist
          path: frontend/${{ matrix.app }}/dist
          retention-days: 1

  build-backend:
    name: Build Backend Applications
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        project:
          - name: BackOffice
            path: MorWalPizVideo.BackOffice
          - name: ServerAPI
            path: MorWalPizVideo.ServerAPI
          - name: ShortLinks
            path: MorWalPizVideo.ShortLinks
          - name: ShootingRange
            path: MorWalPizVideo.ShootingRange
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project.path }}/${{ matrix.project.path }}.csproj

      - name: Build
        run: dotnet build ${{ matrix.project.path }}/${{ matrix.project.path }}.csproj --configuration Release --no-restore

  build-apphost:
    name: Build Aspire AppHost
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore AppHost
        run: dotnet restore MorWalPizVideo.AppHost/MorWalPizVideo.AppHost.csproj

      - name: Build AppHost
        run: dotnet build MorWalPizVideo.AppHost/MorWalPizVideo.AppHost.csproj --configuration Release --no-restore

  build-windows-clients:
    name: Build Windows Client - ${{ matrix.project.name }}
    runs-on: windows-latest

    strategy:
      matrix:
        project:
          - name: InsightScanner
            path: MorWalPiz.InsightScanner/MorWalPiz.InsightScanner.csproj
          - name: VideoImporter
            path: MorWalPiz.VideoImporter/MorWalPiz.VideoImporter.csproj

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project.path }} -p:Platform=AnyCPU

      - name: Build
        run: dotnet build ${{ matrix.project.path }} --configuration Release --no-restore -p:Platform=AnyCPU

  test-backend:
    name: Test Backend Applications
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend test projects
        run: |
          dotnet restore MorWalPizVideo.BackOffice.Tests/MorWalPizVideo.BackOffice.Tests.csproj
          dotnet restore MorWalPizVideo.ShortLinks.Tests/MorWalPizVideo.ShortLinks.Tests.csproj
          dotnet restore MorWalPizVideo.ShootingRange.Tests/MorWalPizVideo.ShootingRange.Tests.csproj

      - name: Test BackOffice regression
        run: |
          dotnet test MorWalPizVideo.BackOffice.Tests/MorWalPizVideo.BackOffice.Tests.csproj --configuration Release --no-restore --list-tests > backoffice-tests.txt
          grep -Eq '^    .+' backoffice-tests.txt
          dotnet test MorWalPizVideo.BackOffice.Tests/MorWalPizVideo.BackOffice.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Test ShortLinks host
        run: |
          dotnet test MorWalPizVideo.ShortLinks.Tests/MorWalPizVideo.ShortLinks.Tests.csproj --configuration Release --no-restore --list-tests > shortlinks-tests.txt
          grep -Eq '^    .+' shortlinks-tests.txt
          dotnet test MorWalPizVideo.ShortLinks.Tests/MorWalPizVideo.ShortLinks.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Test ShootingRange host
        run: |
          dotnet test MorWalPizVideo.ShootingRange.Tests/MorWalPizVideo.ShootingRange.Tests.csproj --configuration Release --no-restore --list-tests > shooting-range-tests.txt
          grep -Eq '^    .+' shooting-range-tests.txt
          dotnet test MorWalPizVideo.ShootingRange.Tests/MorWalPizVideo.ShootingRange.Tests.csproj --configuration Release --no-restore --verbosity normal

  test-youtube-utilities:
    name: Test YouTube Utilities
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MorWalPizVideo.YouTubeUtilities.Tests/MorWalPizVideo.YouTubeUtilities.Tests.csproj

      - name: Test
        run: dotnet test MorWalPizVideo.YouTubeUtilities.Tests/MorWalPizVideo.YouTubeUtilities.Tests.csproj --configuration Release --no-restore --verbosity normal