name: Deploy Shortlinks

on:
  push:
    branches:
      - main
    paths:
      - 'MorWalPizVideo.ShortLinks/**'
      - 'MorWalPizVideo.Domain/**'
      - 'MorWalPizVideo.Models/**'
      - 'MorWalPizVideo.MvcHelpers/**'
      - 'MorWalPizVideo.ServiceDefaults/**'
      - 'MorWalPizVideo.ShortLinks.Tests/**'
      - '.github/workflows/deploy-shortlink.yml'
  workflow_dispatch:
  
permissions:
  id-token: write
  contents: read 

jobs:
  build-and-deploy:
    name: Build and Deploy to Azure
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore MorWalPizVideo.ShortLinks/MorWalPizVideo.ShortLinks.csproj
          dotnet restore MorWalPizVideo.ShortLinks.Tests/MorWalPizVideo.ShortLinks.Tests.csproj

      - name: Run focused ShortLinks tests
        run: |
          dotnet test MorWalPizVideo.ShortLinks.Tests/MorWalPizVideo.ShortLinks.Tests.csproj --configuration Release --no-restore --filter "Category=TestGroup:ShortLinks" --logger "trx;LogFileName=shortlinks-related.trx" --results-directory ./TestResults/shortlinks --verbosity normal
          pwsh -Command '$result = [xml](Get-Content ./TestResults/shortlinks/shortlinks-related.trx); $total = [int]$result.TestRun.ResultSummary.Counters.total; if ($total -le 0) { throw "ShortLinks test filter selected no tests." }'

      - name: Build
        run: dotnet build MorWalPizVideo.ShortLinks/MorWalPizVideo.ShortLinks.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish MorWalPizVideo.ShortLinks/MorWalPizVideo.ShortLinks.csproj --configuration Release --no-build --output ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.SHORTLINKS_APP_NAME }}
          package: ./publish

      - name: Azure logout
        if: always()
        run: az logout