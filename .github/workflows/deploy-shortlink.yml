name: Deploy Shortlinks

on:
  push:
    branches:
      - main
    paths:
      - 'MorWalPizVideo.ShortLinks/**'
      - 'MorWalPizVideo.Domain/**'
      - 'MorWalPizVideo.Models/**'
      - 'MorWalPizVideo.MvcHelpers/**'
      - 'MorWalPizVideo.ServiceDefaults/**'
      - 'MorWalPizVideo.YouTubeUtilities/**'
      - 'MorWalPizVideo.ShortLinks.Tests/**'
      - 'MorWalPizVideo.ShortLinks/Dockerfile'
      - '.dockerignore'
      - '.github/actions/build-container-image/**'
      - '.github/workflows/deploy-shortlink.yml'
  workflow_dispatch:
  
permissions:
  contents: read 
  checks: write

env:
  IMAGE_NAME: shortlinks

jobs:
  test:
    name: Run ShortLinks Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore MorWalPizVideo.ShortLinks/MorWalPizVideo.ShortLinks.csproj
          dotnet restore MorWalPizVideo.ShortLinks.Tests/MorWalPizVideo.ShortLinks.Tests.csproj

      - name: Run focused ShortLinks tests
        run: |
          dotnet test MorWalPizVideo.ShortLinks.Tests/MorWalPizVideo.ShortLinks.Tests.csproj --configuration Release --no-restore --filter "Category=TestGroup:ShortLinks" --logger "trx;LogFileName=shortlinks-related.trx" --results-directory ./TestResults/shortlinks --verbosity minimal
          pwsh -Command '$result = [xml](Get-Content ./TestResults/shortlinks/shortlinks-related.trx); $total = [int]$result.TestRun.ResultSummary.Counters.total; if ($total -le 0) { throw "ShortLinks test filter selected no tests." }'

      - name: Publish ShortLinks test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ./TestResults/**/*.trx
          check_name: ShortLinks test results

  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: production
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build and push Docker image
        uses: ./.github/actions/build-container-image
        with:
          context: .
          file: ./MorWalPizVideo.ShortLinks/Dockerfile
          push: true
          tags: |
            ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cacheFrom: type=registry,ref=${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache
          cacheTo: type=registry,ref=${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Deploy to Azure Web App
        if: false
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.SHORTLINKS_APP_NAME }}
          images: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}