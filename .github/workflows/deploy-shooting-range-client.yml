name: Deploy Shooting Range Client

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/shooting-range.client/**'
      - 'frontend/fe-packages/**'
      - 'frontend/package.json'
      - 'frontend/yarn.lock'
      - 'frontend/shooting-range.client/Dockerfile'
      - '.github/workflows/deploy-shooting-range-client.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read


env:
  IMAGE_NAME: shooting-range-client
  NODE_VERSION: '22.x'

jobs:
  build-test-and-deploy:
    name: Build, Test and Deploy Shooting Range Client
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build shared packages
        working-directory: frontend
        run: yarn build:shared

      - name: Build Shooting Range client
        working-directory: frontend
        run: yarn workspace shooting-range.client build:all

      - name: Test Shooting Range client
        working-directory: frontend
        run: yarn workspace shooting-range.client test --passWithNoTests

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/shooting-range.client/Dockerfile
          push: true
          tags: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.SHOOTING_RANGE_CLIENT_APP_NAME }}
          images: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Azure logout
        if: always()
        run: az logout