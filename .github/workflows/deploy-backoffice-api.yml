name: Deploy BackOffice API

on:
  push:
    branches:
      - main
    paths:
      - 'MorWalPizVideo.BackOffice/**'
      - 'MorWalPizVideo.Domain/**'
      - 'MorWalPizVideo.Models/**'
      - 'MorWalPizVideo.MvcHelpers/**'
      - 'MorWalPizVideo.ServiceDefaults/**'
      - 'MorWalPizVideo.YouTubeUtilities/**'
      - 'MorWalPiz.Contracts/**'
      - 'MorWalPizVideo.BackOffice/Dockerfile'
      - '.dockerignore'
      - '.github/actions/build-container-image/**'
      - '.github/workflows/deploy-backoffice-api.yml'
  workflow_dispatch:
  
permissions:
  id-token: write
  contents: read 
  checks: write

env:
  IMAGE_NAME: backoffice-api

jobs:
  test-related-backend:
    name: Run Related Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore BackOffice tests
        run: dotnet restore MorWalPizVideo.BackOffice.Tests/MorWalPizVideo.BackOffice.Tests.csproj

      - name: Test BackOffice
        run: dotnet test MorWalPizVideo.BackOffice.Tests/MorWalPizVideo.BackOffice.Tests.csproj --configuration Release --no-restore --filter "Category=TestGroup:BackOffice|Category=TestGroup:Shared|Category=TestGroup:CrossApi" --logger "trx;LogFileName=backoffice-related.trx" --results-directory ./TestResults/backoffice --verbosity minimal

      - name: Assert BackOffice test selection is non-empty
        shell: pwsh
        run: |
          $result = [xml](Get-Content ./TestResults/backoffice/backoffice-related.trx)
          $total = [int]$result.TestRun.ResultSummary.Counters.total
          if ($total -le 0) {
            throw "BackOffice-related test filter selected no tests."
          }

      - name: Restore YouTubeUtilities tests
        run: dotnet restore MorWalPizVideo.YouTubeUtilities.Tests/MorWalPizVideo.YouTubeUtilities.Tests.csproj

      - name: Test YouTubeUtilities
        run: dotnet test MorWalPizVideo.YouTubeUtilities.Tests/MorWalPizVideo.YouTubeUtilities.Tests.csproj --configuration Release --no-restore --verbosity minimal

      - name: Publish BackOffice test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ./TestResults/**/*.trx
          check_name: BackOffice test results

  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: production
    needs: test-related-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build and push Docker image
        uses: ./.github/actions/build-container-image
        with:
          context: .
          file: ./MorWalPizVideo.BackOffice/Dockerfile
          push: true
          tags: |
            ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cacheFrom: type=registry,ref=${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache
          cacheTo: type=registry,ref=${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Deploy Docker image to Azure Web App
        if: false
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.BACKOFFICE_API_APP_NAME }}
          images: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-code-to-azure:
    name: Deploy Code Package to Azure
    runs-on: ubuntu-latest
    environment: production
    needs: test-related-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MorWalPizVideo.BackOffice/MorWalPizVideo.BackOffice.csproj

      - name: Build
        run: dotnet build MorWalPizVideo.BackOffice/MorWalPizVideo.BackOffice.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish MorWalPizVideo.BackOffice/MorWalPizVideo.BackOffice.csproj --configuration Release --no-build --output ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy code package to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.BACKOFFICE_API_APP_NAME }}
          package: ./publish

      - name: Azure logout
        if: always()
        run: az logout