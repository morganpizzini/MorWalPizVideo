name: Deploy BackOffice API

on:
  push:
    branches:
      - main
    paths:
      - 'MorWalPizVideo.BackOffice/**'
      - 'MorWalPizVideo.Domain/**'
      - 'MorWalPizVideo.Models/**'
      - 'MorWalPizVideo.MvcHelpers/**'
      - 'MorWalPizVideo.ServiceDefaults/**'
      - 'MorWalPizVideo.YouTubeUtilities/**'
      - 'MorWalPiz.Contracts/**'
      - '.github/workflows/deploy-backoffice-api.yml'
  workflow_dispatch:
  
permissions:
  id-token: write
  contents: read 

jobs:
  test-related-backend:
    name: Run Related Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore BackOffice tests
        run: dotnet restore MorWalPizVideo.BackOffice.Tests/MorWalPizVideo.BackOffice.Tests.csproj

      - name: Test BackOffice
        run: dotnet test MorWalPizVideo.BackOffice.Tests/MorWalPizVideo.BackOffice.Tests.csproj --configuration Release --no-restore --filter "Category=TestGroup:BackOffice|Category=TestGroup:Shared|Category=TestGroup:CrossApi" --logger "trx;LogFileName=backoffice-related.trx" --results-directory ./TestResults/backoffice --verbosity normal

      - name: Assert BackOffice test selection is non-empty
        shell: pwsh
        run: |
          $result = [xml](Get-Content ./TestResults/backoffice/backoffice-related.trx)
          $total = [int]$result.TestRun.ResultSummary.Counters.total
          if ($total -le 0) {
            throw "BackOffice-related test filter selected no tests."
          }

      - name: Restore YouTubeUtilities tests
        run: dotnet restore MorWalPizVideo.YouTubeUtilities.Tests/MorWalPizVideo.YouTubeUtilities.Tests.csproj

      - name: Test YouTubeUtilities
        run: dotnet test MorWalPizVideo.YouTubeUtilities.Tests/MorWalPizVideo.YouTubeUtilities.Tests.csproj --configuration Release --no-restore --verbosity normal

  build-and-deploy:
    name: Build and Deploy to Azure
    runs-on: ubuntu-latest
    environment: production
    needs: test-related-backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MorWalPizVideo.BackOffice/MorWalPizVideo.BackOffice.csproj

      - name: Build
        run: dotnet build MorWalPizVideo.BackOffice/MorWalPizVideo.BackOffice.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish MorWalPizVideo.BackOffice/MorWalPizVideo.BackOffice.csproj --configuration Release --no-build --output ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.BACKOFFICE_API_APP_NAME }}
          package: ./publish

      - name: Azure logout
        if: always()
        run: az logout