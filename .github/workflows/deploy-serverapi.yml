name: Deploy ServerAPI

on:
  push:
    branches:
      - main
    paths:
      - 'MorWalPizVideo.ServerAPI/**'
      - 'MorWalPizVideo.Domain/**'
      - 'MorWalPizVideo.Models/**'
      - 'MorWalPizVideo.MvcHelpers/**'
      - 'MorWalPizVideo.ServiceDefaults/**'
      - 'MorWalPizVideo.YouTubeUtilities/**'
      - 'MorWalPiz.Contracts/**'
      - '.github/workflows/deploy-serverapi.yml'
  workflow_dispatch:
  
permissions:
  id-token: write
  contents: read 
  checks: write

jobs:
  test-related-backend:
    name: Run Related Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore BackOffice tests
        run: dotnet restore MorWalPizVideo.BackOffice.Tests/MorWalPizVideo.BackOffice.Tests.csproj

      - name: Test BackOffice
        run: dotnet test MorWalPizVideo.BackOffice.Tests/MorWalPizVideo.BackOffice.Tests.csproj --configuration Release --no-restore --filter "Category=TestGroup:ServerAPI|Category=TestGroup:Shared|Category=TestGroup:CrossApi" --logger "trx;LogFileName=serverapi-related.trx" --results-directory ./TestResults/serverapi --verbosity minimal

      - name: Assert ServerAPI test selection is non-empty
        shell: pwsh
        run: |
          $result = [xml](Get-Content ./TestResults/serverapi/serverapi-related.trx)
          $total = [int]$result.TestRun.ResultSummary.Counters.total
          if ($total -le 0) {
            throw "ServerAPI-related test filter selected no tests."
          }

      - name: Restore YouTubeUtilities tests
        run: dotnet restore MorWalPizVideo.YouTubeUtilities.Tests/MorWalPizVideo.YouTubeUtilities.Tests.csproj

      - name: Test YouTubeUtilities
        run: dotnet test MorWalPizVideo.YouTubeUtilities.Tests/MorWalPizVideo.YouTubeUtilities.Tests.csproj --configuration Release --no-restore --verbosity minimal

      - name: Publish ServerAPI test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ./TestResults/**/*.trx
          check_name: ServerAPI test results

  build-and-deploy:
    name: Build and Deploy to Azure
    runs-on: ubuntu-latest
    environment: production
    needs: test-related-backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MorWalPizVideo.ServerAPI/MorWalPizVideo.ServerAPI.csproj

      - name: Build
        run: dotnet build MorWalPizVideo.ServerAPI/MorWalPizVideo.ServerAPI.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish MorWalPizVideo.ServerAPI/MorWalPizVideo.ServerAPI.csproj --configuration Release --no-build --output ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.SERVERAPI_APP_NAME }}
          package: ./publish

      - name: Smoke test anonymous account bootstrap
        env:
          SERVERAPI_BASE_URL: ${{ vars.SERVERAPI_BASE_URL }}
          SERVERAPI_APP_NAME: ${{ vars.SERVERAPI_APP_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          base_url="${SERVERAPI_BASE_URL:-https://${SERVERAPI_APP_NAME}.azurewebsites.net}"
          base_url="${base_url%/}"
          headers_file="$(mktemp)"
          body_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$body_file" --dump-header "$headers_file" --write-out '%{http_code}' --header 'Origin: https://morwalpiz.com' "$base_url/api/v1/account/csrf")"
          if [[ "$status" != "200" ]]; then
            echo "Anonymous CSRF smoke test returned HTTP $status"
            cat "$headers_file"
            cat "$body_file"
            exit 1
          fi
          grep -Eiq '"token"[[:space:]]*:' "$body_file" || { echo "CSRF response did not contain a token"; cat "$body_file"; exit 1; }
          grep -Eiq '^set-cookie:.*csrf' "$headers_file" || { echo "CSRF response did not set a cookie"; cat "$headers_file"; exit 1; }
          grep -Eiq '^access-control-allow-origin:[[:space:]]*https://morwalpiz.com' "$headers_file" || { echo "CSRF response did not allow the public origin"; cat "$headers_file"; exit 1; }
          grep -Eiq '^access-control-allow-credentials:[[:space:]]*true' "$headers_file" || { echo "CSRF response did not allow credentials"; cat "$headers_file"; exit 1; }

      - name: Azure logout
        if: always()
        run: az logout