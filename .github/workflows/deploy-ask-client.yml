name: Deploy Ask Client
on:
  push:
    branches: [main]
    paths: ['frontend/ask.client/**', 'frontend/fe-packages/**', 'frontend/package.json', 'frontend/yarn.lock', '.github/actions/build-container-image/**', '.github/workflows/deploy-ask-client.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE_NAME: ask-client
jobs:
  validate:
    name: Validate Ask Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Build shared packages
        working-directory: frontend
        run: yarn build:shared
      - name: Test shared transport
        working-directory: frontend
        run: yarn workspace @morwalpizvideo/services test --passWithNoTests=false
      - name: Test Ask client
        working-directory: frontend
        run: yarn workspace ask.client test --passWithNoTests=false
      - name: Checked client and SSR build
        working-directory: frontend
        run: yarn workspace ask.client build:all

  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: production
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build and push Docker image
        uses: ./.github/actions/build-container-image
        with:
          context: ./frontend
          file: ./frontend/ask.client/Dockerfile
          push: true
          tags: |
            ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cacheFrom: type=registry,ref=${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache
          cacheTo: type=registry,ref=${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Deploy to Azure Web App
        if: false
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.ASK_CLIENT_APP_NAME }}
          images: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}