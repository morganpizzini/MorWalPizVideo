name: Deploy FreezerAnalysis SPA

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/FreezerAnalysis.spa/**'
      - 'frontend/fe-packages/**'
      - 'frontend/package.json'
      - 'frontend/yarn.lock'
      - 'frontend/FreezerAnalysis.spa/Dockerfile'
      - 'frontend/FreezerAnalysis.spa/nginx.conf'
      - '.github/actions/build-container-image/**'
      - '.github/workflows/deploy-freezer-analysis-spa.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  checks: write

env:
  IMAGE_NAME: freezer-analysis-spa

jobs:
  test:
    name: Run FreezerAnalysis SPA Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build shared packages
        working-directory: frontend
        run: yarn build:shared

      - name: Run tests
        working-directory: frontend/FreezerAnalysis.spa
        run: yarn test

      - name: Check application build
        working-directory: frontend
        run: yarn workspace freezer-analysis.spa build

  build-and-deploy:
    name: Build and Deploy to Azure
    runs-on: ubuntu-latest
    environment: production
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build and push Docker image
        uses: ./.github/actions/build-container-image
        with:
          context: ./frontend
          file: ./frontend/FreezerAnalysis.spa/Dockerfile
          push: true
          noCache: false
          buildArgs: |
            VITE_FREEZER_API_BASE_URL=${{ vars.FREEZER_ANALYSIS_API_BASE_URL }}
          tags: |
            ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cacheFrom: type=registry,ref=${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache
          cacheTo: type=registry,ref=${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.FREEZER_ANALYSIS_SPA_APP_NAME }}
          images: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Azure logout
        if: always()
        run: az logout