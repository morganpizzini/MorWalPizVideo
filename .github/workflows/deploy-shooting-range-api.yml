name: Deploy Shooting Range API

on:
  push:
    branches:
      - main
    paths:
      - 'MorWalPizVideo.ShootingRange/**'
      - 'MorWalPizVideo.Domain/**'
      - 'MorWalPizVideo.YouTubeUtilities/**'
      - 'MorWalPizVideo.Models/**'
      - 'MorWalPizVideo.MvcHelpers/**'
      - 'MorWalPizVideo.ServiceDefaults/**'
      - 'MorWalPiz.Contracts/**'
      - 'MorWalPizVideo.ShootingRange.Tests/**'
      - 'MorWalPizVideo.ShootingRange.Migration/**'
      - 'MorWalPizVideo.sln'
      - 'MorWalPizVideo.ShootingRange/Dockerfile'
      - '.dockerignore'
      - '.github/actions/build-container-image/**'
      - '.github/workflows/deploy-shooting-range-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  IMAGE_NAME: shooting-range-api

jobs:
  test:
    name: Build and Test Shooting Range API
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API and focused tests
        run: |
          dotnet restore MorWalPizVideo.ShootingRange/MorWalPizVideo.ShootingRange.csproj
          dotnet restore MorWalPizVideo.ShootingRange.Tests/MorWalPizVideo.ShootingRange.Tests.csproj
          dotnet restore MorWalPizVideo.ShootingRange.Migration/MorWalPizVideo.ShootingRange.Migration.csproj

      - name: Build API
        run: dotnet build MorWalPizVideo.ShootingRange/MorWalPizVideo.ShootingRange.csproj --configuration Release --no-restore

      - name: Build Mongo-to-Azure SQL operator migration tool
        run: dotnet build MorWalPizVideo.ShootingRange.Migration/MorWalPizVideo.ShootingRange.Migration.csproj --configuration Release --no-restore

      - name: Run focused Shooting Range tests with mock repositories
        env:
          FeatureManagement__EnableMock: 'true'
        run: |
          dotnet test MorWalPizVideo.ShootingRange.Tests/MorWalPizVideo.ShootingRange.Tests.csproj --configuration Release --no-restore --filter FullyQualifiedName~ShootingRange --logger "trx;LogFileName=shooting-range-related.trx" --results-directory ./TestResults/shooting-range --verbosity minimal
          pwsh -Command '$result = [xml](Get-Content ./TestResults/shooting-range/shooting-range-related.trx); $total = [int]$result.TestRun.ResultSummary.Counters.total; if ($total -le 0) { throw "Shooting Range test filter selected no tests." }'

      - name: Start disposable SQL Server
        shell: bash
        run: |
          password="Range!$(openssl rand -hex 24)aA9"
          echo "::add-mask::$password"
          printf 'SHOOTING_RANGE_TEST_SQL_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          docker run --detach --name shooting-range-sqlserver \
            --publish 1433:1433 \
            --env ACCEPT_EULA=Y \
            --env MSSQL_PID=Developer \
            --env MSSQL_SA_PASSWORD="$password" \
            mcr.microsoft.com/mssql/server:2022-latest
          for attempt in $(seq 1 60); do
            if docker exec shooting-range-sqlserver /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$password" -C -Q "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs shooting-range-sqlserver
          exit 1

      - name: Require SQL Server transaction and concurrency release gate
        env:
          SHOOTING_RANGE_TEST_SQL_HOST: localhost
          SHOOTING_RANGE_TEST_SQL_PORT: '1433'
          SHOOTING_RANGE_TEST_SQL_DATABASE: master
          SHOOTING_RANGE_TEST_SQL_USERNAME: sa
        run: |
          dotnet test MorWalPizVideo.ShootingRange.Tests/MorWalPizVideo.ShootingRange.Tests.csproj --configuration Release --no-restore --no-build --filter FullyQualifiedName~ShootingRangeSqlServerTests --logger "trx;LogFileName=shooting-range-sqlserver.trx" --results-directory ./TestResults/shooting-range --verbosity minimal
          pwsh -Command '$result = [xml](Get-Content ./TestResults/shooting-range/shooting-range-sqlserver.trx); $total = [int]$result.TestRun.ResultSummary.Counters.total; $executed = [int]$result.TestRun.ResultSummary.Counters.executed; if ($total -le 0 -or $executed -le 0) { throw "Shooting Range SQL Server test filter selected or executed no tests." }'

      - name: Publish Shooting Range test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ./TestResults/**/*.trx
          check_name: Shooting Range test results

  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: production
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build and push Docker image
        uses: ./.github/actions/build-container-image
        with:
          context: .
          file: ./MorWalPizVideo.ShootingRange/Dockerfile
          push: true
          tags: |
            ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cacheFrom: type=registry,ref=${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache
          cacheTo: type=registry,ref=${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.SHOOTING_RANGE_API_APP_NAME }}
          images: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}