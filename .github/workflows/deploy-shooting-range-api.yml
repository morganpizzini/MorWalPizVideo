name: Deploy Shooting Range API

on:
  push:
    branches:
      - main
    paths:
      - 'MorWalPizVideo.ShootingRange/**'
      - 'MorWalPizVideo.Domain/**'
      - 'MorWalPizVideo.YouTubeUtilities/**'
      - 'MorWalPizVideo.Models/**'
      - 'MorWalPizVideo.MvcHelpers/**'
      - 'MorWalPizVideo.ServiceDefaults/**'
      - 'MorWalPiz.Contracts/**'
      - 'MorWalPizVideo.ShootingRange.Tests/**'
      - 'MorWalPizVideo.ShootingRange/Dockerfile'
      - '.dockerignore'
      - '.github/actions/build-container-image/**'
      - '.github/workflows/deploy-shooting-range-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  IMAGE_NAME: shooting-range-api

jobs:
  test:
    name: Build and Test Shooting Range API
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API and focused tests
        run: |
          dotnet restore MorWalPizVideo.ShootingRange/MorWalPizVideo.ShootingRange.csproj
          dotnet restore MorWalPizVideo.ShootingRange.Tests/MorWalPizVideo.ShootingRange.Tests.csproj

      - name: Build API
        run: dotnet build MorWalPizVideo.ShootingRange/MorWalPizVideo.ShootingRange.csproj --configuration Release --no-restore

      - name: Run focused Shooting Range tests with mock repositories
        env:
          FeatureManagement__EnableMock: 'true'
        run: |
          dotnet test MorWalPizVideo.ShootingRange.Tests/MorWalPizVideo.ShootingRange.Tests.csproj --configuration Release --no-restore --filter FullyQualifiedName~ShootingRange --logger "trx;LogFileName=shooting-range-related.trx" --results-directory ./TestResults/shooting-range --verbosity minimal
          pwsh -Command '$result = [xml](Get-Content ./TestResults/shooting-range/shooting-range-related.trx); $total = [int]$result.TestRun.ResultSummary.Counters.total; if ($total -le 0) { throw "Shooting Range test filter selected no tests." }'

      - name: Require real Mongo transaction and concurrency release gate
        env:
          SHOOTING_RANGE_TEST_MONGO_URI: ${{ secrets.SHOOTING_RANGE_TEST_MONGO_URI }}
        run: |
          if [ -z "$SHOOTING_RANGE_TEST_MONGO_URI" ]; then
            echo "Release blocked: configure a disposable transaction-capable Mongo test server in the production environment." >&2
            exit 1
          fi
          dotnet test MorWalPizVideo.ShootingRange.Tests/MorWalPizVideo.ShootingRange.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~ShootingRangeMongoTests --logger "trx;LogFileName=shooting-range-mongo.trx" --results-directory ./TestResults/shooting-range --verbosity minimal
          pwsh -Command '$result = [xml](Get-Content ./TestResults/shooting-range/shooting-range-mongo.trx); $total = [int]$result.TestRun.ResultSummary.Counters.total; $executed = [int]$result.TestRun.ResultSummary.Counters.executed; if ($total -le 0 -or $executed -le 0) { throw "Shooting Range Mongo test filter selected or executed no tests." }'

      - name: Publish Shooting Range test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ./TestResults/**/*.trx
          check_name: Shooting Range test results

  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: production
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Build and push Docker image
        uses: ./.github/actions/build-container-image
        with:
          context: .
          file: ./MorWalPizVideo.ShootingRange/Dockerfile
          push: true
          tags: |
            ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cacheFrom: type=registry,ref=${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache
          cacheTo: type=registry,ref=${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Deploy to Azure Web App
        if: false
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.SHOOTING_RANGE_API_APP_NAME }}
          images: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}